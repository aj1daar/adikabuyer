# Dev infra only — Postgres/RabbitMQ/MinIO + gateway in Docker, the JVM services and
# frontend run on the host. Its own project name so volumes/containers never collide
# with the full docker-compose.prod.yml stack.
name: adikabuyer-dev

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: adikabuyer-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: adikabuyer
      POSTGRES_PASSWORD: adikabuyer
      POSTGRES_DB: adikabuyer
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - adikabuyer-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: adikabuyer-dev-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: adikabuyer
      RABBITMQ_DEFAULT_PASS: adikabuyer
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - adikabuyer-network

  minio:
    image: minio/minio:latest
    container_name: adikabuyer-dev-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: adikabuyer
      MINIO_ROOT_PASSWORD: adikabuyer123
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - adikabuyer-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: adikabuyer-dev-api-gateway
    restart: unless-stopped
    environment:
      CATALOG_SERVICE_URL: http://host.docker.internal:8081
      ORDER_SERVICE_URL: http://host.docker.internal:8082
    ports:
      - "8080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - adikabuyer-network

networks:
  adikabuyer-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
