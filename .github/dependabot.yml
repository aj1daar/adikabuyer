version: 2
updates:
  - package-ecosystem: maven
    directory: /catalog-service
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*", "org.springframework.boot*"]

  - package-ecosystem: maven
    directory: /order-service
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*", "org.springframework.boot*"]

  - package-ecosystem: maven
    directory: /api-gateway
    schedule:
      interval: weekly
    groups:
      spring:
        patterns: ["org.springframework*", "org.springframework.boot*", "org.springframework.cloud*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directories:
      - /catalog-service
      - /order-service
      - /api-gateway
      - /frontend
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
