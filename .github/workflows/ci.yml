name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  catalog-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: catalog-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  order-service-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: order-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B test

  frontend-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx tsc -b --noEmit
      - run: npm run test
      - run: npm run build

  dependency-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  e2e-smoke:
    # Boots the real docker-compose.prod.yml stack and runs scripts/e2e-smoke.sh.
    # Catches what the mock-based unit tests can't: Flyway migrations, RabbitMQ
    # round-trips, gateway routing, cross-service calls, Caddy headers.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Write a throwaway env file
        run: |
          cat > .env.ci <<'EOF'
          DOMAIN=localhost
          CORS_ALLOWED_ORIGIN=http://localhost:5173
          POSTGRES_USER=adikabuyer
          POSTGRES_PASSWORD=ci-only-postgres-password
          POSTGRES_DB=adikabuyer
          RABBITMQ_USER=adikabuyer
          RABBITMQ_PASSWORD=ci-only-rabbit-password
          MINIO_ROOT_USER=adikabuyer
          MINIO_ROOT_PASSWORD=ci-only-minio-password
          S3_BUCKET=adikabuyer-media
          S3_PUBLIC_URL_BASE=https://localhost/media/adikabuyer-media
          APP_JWT_SECRET=ci-only-jwt-secret-not-used-anywhere-real-0000000000000000000
          APP_SECURITY_ADMIN_USERNAME=admin
          APP_SECURITY_ADMIN_PASSWORD_HASH=$$2a$$10$$9BguCDSXLntTaKP7osWD..AgeTJ5gZs69qeWqqgizXeppyOjuEgoO
          TELEGRAM_BOT_TOKEN=
          TELEGRAM_REGISTRATION_PASSWORD=
          CATALOG_SERVICE_JAVA_OPTS=-Xmx512m
          ORDER_SERVICE_JAVA_OPTS=-Xmx512m
          GATEWAY_JAVA_OPTS=-Xmx512m
          EOF
      - name: Bring the stack up
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci up -d --build --wait --wait-timeout 360
      - name: Smoke test
        run: bash scripts/e2e-smoke.sh https://localhost admin devpassword
      - name: Stack logs (on failure)
        if: failure()
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci logs --tail 200
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml --env-file .env.ci down -v
