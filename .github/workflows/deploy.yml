name: Deploy

# Deploys only after CI has passed for a push to main — a red build or a failing
# e2e smoke never reaches production. workflow_dispatch stays as a manual escape hatch.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY: ${{ secrets.BACKUP_S3_ACCESS_KEY }}
          BACKUP_S3_SECRET_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
        with:
          envs: BACKUP_S3_ENDPOINT,BACKUP_S3_BUCKET,BACKUP_S3_ACCESS_KEY,BACKUP_S3_SECRET_KEY
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 30m
          script: |
            cd /opt/adikabuyer
            git fetch origin main
            # the exact commit CI just verified, not whatever main points at by now
            git reset --hard ${{ github.event.workflow_run.head_sha || 'origin/main' }}
            echo '${{ secrets.ENV_PROD_B64 }}' | base64 -d > .env.prod
            # off-site backup credentials live in their own secrets so they can be rotated
            # without re-encoding the whole env file; unset ones are skipped
            for name in BACKUP_S3_ENDPOINT BACKUP_S3_BUCKET BACKUP_S3_ACCESS_KEY BACKUP_S3_SECRET_KEY; do
              value="$(printenv "$name" || true)"
              if [ -n "$value" ]; then printf '\n%s=%s\n' "$name" "$value" >> .env.prod; fi
            done
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build --remove-orphans
            # Force-recreate the components that resolve other containers by name, so a
            # rebuilt catalog/order container behind a new IP doesn't leave stale DNS in
            # the gateway; caddy re-reads its bind-mounted Caddyfile the same way.
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --force-recreate --no-deps api-gateway caddy
            docker image prune -f
