server:
  port: 8082
  forward-headers-strategy: framework

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://localhost:5433/adikabuyer_orders
    username: adikabuyer
    password: adikabuyer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: adikabuyer
    password: adikabuyer

app:
  catalog:
    # order-service calls catalog-service directly (internal), not through the gateway
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8081}
  rabbitmq:
    exchange: order.exchange
    queue: order.queue
    routing-key: order.new
  delivery:
    # Bishkek-only shop: courier inside the city, or the customer picks the order up.
    bishkek-fee: 300
    pickup-fee: 0
  jwt:
    # Dev-only fallback; must match catalog-service. Real value comes from APP_JWT_SECRET
    # (enforced in prod by docker-compose.prod.yml `:?`). Never deploy the fallback.
    secret: ${APP_JWT_SECRET:dev-only-insecure-jwt-secret-not-for-production-000000000000}
  telegram:
    bot-token: ${TELEGRAM_BOT_TOKEN:}
    registration-password: ${TELEGRAM_REGISTRATION_PASSWORD:}
