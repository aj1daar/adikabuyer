    access-key: ${S3_ACCESS_KEY:adikabuyer}
    secret-key: ${S3_SECRET_KEY:adikabuyer123}
    bucket: ${S3_BUCKET:adikabuyer-media}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:auto}
    public-url-base: ${S3_PUBLIC_URL_BASE:http://localhost:9000/adikabuyer-media}
  rabbitmq:
    exchange: order.exchange
    queue: order.queue
    routing-key: order.new
  jwt:
