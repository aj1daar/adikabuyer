server:
  port: 8081
  forward-headers-strategy: framework

spring:
  application:
    name: catalog-service
  datasource:
    url: jdbc:postgresql://localhost:5433/adikabuyer
    username: adikabuyer
    password: adikabuyer
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  rabbitmq:
    host: localhost
    port: 5672
    username: adikabuyer
    password: adikabuyer
    listener:
      simple:
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1000
          multiplier: 2.0
          max-interval: 30000
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

app:
  s3:
    access-key: ${S3_ACCESS_KEY:adikabuyer}
    secret-key: ${S3_SECRET_KEY:adikabuyer123}
    bucket: ${S3_BUCKET:adikabuyer-media}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:auto}
    public-url-base: ${S3_PUBLIC_URL_BASE:http://localhost:9000/adikabuyer-media}
  rabbitmq:
    exchange: order.exchange
    queue: order.queue
    routing-key: order.new
    dead-letter-exchange: order.dlx
    dead-letter-queue: order.queue.dlq
    dead-letter-routing-key: order.new.dlq
  jwt:
    # Dev-only fallback. Real value MUST come from APP_JWT_SECRET (enforced in prod by
    # docker-compose.prod.yml `:?` and application-prod.yml). Never deploy the fallback.
    secret: ${APP_JWT_SECRET:dev-only-insecure-jwt-secret-not-for-production-000000000000}
    expiration-ms: 3600000
  security:
    admin-username: ${APP_SECURITY_ADMIN_USERNAME:admin}
    # Dev-only fallback: bcrypt hash of "devpassword". Real value MUST come from
    # APP_SECURITY_ADMIN_PASSWORD_HASH in prod.
    admin-password-hash: ${APP_SECURITY_ADMIN_PASSWORD_HASH:$2a$10$9BguCDSXLntTaKP7osWD..AgeTJ5gZs69qeWqqgizXeppyOjuEgoO}
