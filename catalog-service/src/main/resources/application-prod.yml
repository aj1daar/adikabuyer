spring:
  jpa:
    show-sql: false

app:
  jwt:
    # No default on purpose: an unset variable fails startup with "Could not resolve placeholder".
    # (Spring has no shell-style `:?` — `${X:?msg}` would silently use "?msg" as the secret.)
    secret: ${APP_JWT_SECRET}
  security:
    admin-password-hash: ${APP_SECURITY_ADMIN_PASSWORD_HASH}
