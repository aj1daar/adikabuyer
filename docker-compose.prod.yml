name: adikabuyer

services:
  postgres-db:
    image: postgres:16-alpine
    container_name: adikabuyer-postgres
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-adikabuyer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-adikabuyer}
    # No host port: only the app containers reach Postgres, over the bridge network.
    # For debugging on the host: docker compose -f docker-compose.prod.yml exec postgres-db psql -U "$POSTGRES_USER"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    networks:
      - adikabuyer-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: adikabuyer-rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-adikabuyer}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set}
    # No host ports: the broker (5672) is reached by the app containers over the bridge
    # network; the management UI (15672) is bound to loopback only, reach it via
    # `ssh -L 15672:localhost:15672 <server>`.
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      - adikabuyer-network

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z@sha256:a1a8bd4ac40ad7881a245bab97323e18f971e4d4cba2c2007ec1bedd21cbaba2
    container_name: adikabuyer-minio
    restart: unless-stopped
    mem_limit: 512m
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-adikabuyer}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD must be set}
    command: server /data --console-address ":9001"
    # Public media is served through Caddy (handle_path /media/*), which reaches MinIO
    # over the bridge network. Host ports are bound to loopback only — for `mc` / the
    # console, tunnel in: `ssh -L 9000:localhost:9000 -L 9001:localhost:9001 <server>`.
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    networks:
      - adikabuyer-network

  catalog-service:
    build:
      context: ./catalog-service
    container_name: adikabuyer-catalog-service
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - postgres-db
      - rabbitmq
      - minio
    environment:
      JAVA_OPTS: ${CATALOG_SERVICE_JAVA_OPTS:--Xmx256m -Xms128m}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-adikabuyer}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-adikabuyer}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-adikabuyer}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-adikabuyer}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-adikabuyer-media}
      S3_PUBLIC_URL_BASE: ${S3_PUBLIC_URL_BASE:-http://localhost:9000/adikabuyer-media}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      APP_SECURITY_ADMIN_USERNAME: ${APP_SECURITY_ADMIN_USERNAME:-admin}
      APP_SECURITY_ADMIN_PASSWORD_HASH: ${APP_SECURITY_ADMIN_PASSWORD_HASH:?APP_SECURITY_ADMIN_PASSWORD_HASH must be set}
      APP_SECURITY_LOGIN_MAX_PER_IP: ${APP_SECURITY_LOGIN_MAX_PER_IP:-5}
      APP_SECURITY_LOGIN_MAX_GLOBAL: ${APP_SECURITY_LOGIN_MAX_GLOBAL:-20}
    networks:
      - adikabuyer-network

  order-service:
    build:
      context: ./order-service
    container_name: adikabuyer-order-service
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - postgres-db
      - rabbitmq
    environment:
      JAVA_OPTS: ${ORDER_SERVICE_JAVA_OPTS:--Xmx256m -Xms128m}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/${POSTGRES_DB:-adikabuyer}_orders
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-adikabuyer}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-adikabuyer}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      APP_JWT_SECRET: ${APP_JWT_SECRET:?APP_JWT_SECRET must be set}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_REGISTRATION_PASSWORD: ${TELEGRAM_REGISTRATION_PASSWORD:-}
    networks:
      - adikabuyer-network

  api-gateway:
    build:
      context: ./api-gateway
    container_name: adikabuyer-api-gateway
    restart: unless-stopped
    mem_limit: 384m
    depends_on:
      - catalog-service
      - order-service
    environment:
      JAVA_OPTS: ${GATEWAY_JAVA_OPTS:--Xmx256m -Xms128m}
      CATALOG_SERVICE_URL: http://catalog-service:8081
      ORDER_SERVICE_URL: http://order-service:8082
      CORS_ALLOWED_ORIGIN: ${CORS_ALLOWED_ORIGIN:-http://localhost:5173}
    networks:
      - adikabuyer-network

  caddy:
    build:
      context: ./frontend
    container_name: adikabuyer-caddy
    restart: unless-stopped
    mem_limit: 128m
    depends_on:
      - api-gateway
    environment:
      DOMAIN: ${DOMAIN}
      # Caddy site address. Unset -> "localhost" (auto-HTTPS via Caddy's internal CA).
      # Prod: set to "adikabuyer.kg, www.adikabuyer.kg". Local browser use: "http://localhost".
      CADDY_SITE: ${CADDY_SITE:-${DOMAIN}}
      CADDY_HSTS: ${CADDY_HSTS-31536000}
      CADDY_CSP_TAIL: ${CADDY_CSP_TAIL-; upgrade-insecure-requests}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - adikabuyer-network

networks:
  adikabuyer-network:
    driver: bridge

volumes:
  postgres-data:
  rabbitmq-data:
  minio-data:
  caddy-data:
  caddy-config:
